services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/devops_platform
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      KUBERNETES_API_URL: ${KUBERNETES_API_URL:-https://host.docker.internal:6550}
      KUBECONFIG: /run/k3s-lab/config
    volumes:
      - ./k3s_lab/credentials:/run/k3s-lab:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devops_platform
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_platform"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
